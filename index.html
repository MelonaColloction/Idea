<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <title>IdeaVault</title>
  <style>
    :root {
      --bg: #0a0e17;
      --bg-grad-1: rgba(79, 172, 254, 0.10);
      --bg-grad-2: rgba(147, 51, 234, 0.08);
      --panel-bg: rgba(16, 21, 33, 0.78);
      --panel-border: rgba(120, 160, 255, 0.15);
      --panel-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.85);
      --text-primary: #eef2ff;
      --text-secondary: #b8d0ff;
      --text-muted: #6b7f9e;
      --text-completed: #7d90b3;
      --item-bg: rgba(12, 16, 26, 0.7);
      --item-bg-hover: rgba(20, 28, 45, 0.85);
      --item-border: rgba(90, 130, 210, 0.18);
      --item-border-hover: rgba(79, 172, 254, 0.45);
      --item-completed-bg: rgba(14, 19, 30, 0.5);
      --input-bg: rgba(8, 12, 20, 0.85);
      --input-border: rgba(90, 140, 220, 0.25);
      --input-focus-bg: #0d1627;
      --chip-bg: rgba(255, 255, 255, 0.03);
      --chip-border: rgba(120, 170, 255, 0.18);
      --accent: #3b82f6;
      --accent-2: #2563eb;
      --accent-glow: #3b82f6aa;
      --danger: #ef4444;
      --success: #22c55e;
      --progress-bg: rgba(30, 41, 59, 0.7);
      --check-border: #3865a8;
      --check-bg: rgba(10, 18, 32, 0.9);
      --check-hover-bg: #13233b;
      --check-hover-border: #6ea8fe;
      --check-checked-border: #b1d0ff;
    }

    [data-theme="light"] {
      --bg: #f0f4fb;
      --bg-grad-1: rgba(59, 130, 246, 0.08);
      --bg-grad-2: rgba(147, 51, 234, 0.05);
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(59, 130, 246, 0.15);
      --panel-shadow: 0 30px 60px -20px rgba(30, 58, 138, 0.18);
      --text-primary: #1e293b;
      --text-secondary: #3b5a8c;
      --text-muted: #94a3b8;
      --text-completed: #94a3b8;
      --item-bg: rgba(255, 255, 255, 0.9);
      --item-bg-hover: #ffffff;
      --item-border: rgba(59, 130, 246, 0.15);
      --item-border-hover: rgba(59, 130, 246, 0.4);
      --item-completed-bg: rgba(241, 245, 249, 0.8);
      --input-bg: rgba(255, 255, 255, 0.95);
      --input-border: rgba(59, 130, 246, 0.25);
      --input-focus-bg: #ffffff;
      --chip-bg: rgba(255, 255, 255, 0.6);
      --chip-border: rgba(59, 130, 246, 0.2);
      --accent: #2563eb;
      --accent-2: #1d4ed8;
      --progress-bg: rgba(226, 232, 240, 0.9);
      --check-border: #93b4e0;
      --check-bg: #ffffff;
      --check-hover-bg: #eff6ff;
      --check-hover-border: #3b82f6;
      --check-checked-border: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      transition: background 0.4s ease, color 0.4s ease;
      overscroll-behavior: none;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 15% 20%, var(--bg-grad-1) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, var(--bg-grad-2) 0%, transparent 45%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ================= PANEL ================= */
    .panel {
      width: 100%;
      max-width: 760px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.2rem;
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-shadow), 0 0 0 1px rgba(255, 255, 255, 0.02) inset, 0 0 40px rgba(79, 172, 254, 0.08);
      padding: 2rem 1.8rem;
      margin-top: 1rem;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    /* ================= HEADER ================= */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.4rem;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header h1 .icon {
      font-size: 1.7rem;
      filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: all 0.2s;
      color: var(--text-primary);
    }

    .icon-btn:active { transform: scale(0.95); }

    /* ================= STATS ================= */
    .stats-card {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 1.4rem;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
    }

    .stats-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.7rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .stats-label { font-size: 0.92rem; color: var(--text-secondary); font-weight: 500; }

    .stats-percent { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }

    .stats-percent .num {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 0.15rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--progress-bg);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: 20px;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.3, 1, 0.4, 1);
      box-shadow: 0 0 12px var(--accent-glow);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .stats-detail {
      display: flex;
      justify-content: space-between;
      margin-top: 0.7rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .stats-detail strong { color: var(--text-secondary); font-weight: 600; }

    /* ================= TOOLBAR ================= */
    .toolbar {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }

    .search-wrap { flex: 1; min-width: 180px; position: relative; }

    .search-wrap input {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 1.2rem;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      transition: all 0.25s;
    }

    .search-wrap input::placeholder { color: var(--text-muted); }

    .search-wrap input:focus {
      border-color: var(--accent);
      background: var(--input-focus-bg);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .search-wrap .search-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .clear-search {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      display: none;
    }

    .clear-search.visible { display: block; }
    .clear-search:active { color: var(--danger); }

    .sort-wrap { position: relative; }

    .sort-btn {
      height: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 1.2rem;
      padding: 0.85rem 1rem;
      font-size: 0.92rem;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
      white-space: nowrap;
    }

    .sort-btn .arrow { font-size: 0.7rem; transition: transform 0.25s; }
    .sort-wrap.open .sort-btn .arrow { transform: rotate(180deg); }

    .sort-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 200px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--panel-border);
      border-radius: 1rem;
      padding: 0.4rem;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: all 0.2s;
      z-index: 100;
    }

    .sort-wrap.open .sort-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .sort-option {
      padding: 0.65rem 0.9rem;
      border-radius: 0.7rem;
      cursor: pointer;
      font-size: 0.92rem;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .sort-option:active { background: var(--item-bg-hover); }

    .sort-option.active {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      color: #fff;
    }

    .sort-option .check { opacity: 0; }
    .sort-option.active .check { opacity: 1; }

    /* ================= IDEA LIST ================= */
    .idea-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 1.6rem;
      max-height: 45vh;
      overflow-y: auto;
      padding: 0 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    .idea-list::-webkit-scrollbar { width: 5px; }
    .idea-list::-webkit-scrollbar-track { background: transparent; }
    .idea-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 20px; }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.9;
      border: 1px dashed var(--chip-border);
      border-radius: 1.6rem;
      background: var(--item-bg);
    }

    .empty-state .emoji {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 0.6rem;
      filter: drop-shadow(0 0 20px var(--accent-glow));
    }

    .idea-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      background: var(--item-bg);
      padding: 1rem 1.1rem;
      border-radius: 1.3rem;
      border: 1px solid var(--item-border);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      animation: fadeIn 0.35s ease both;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .idea-check {
      appearance: none;
      -webkit-appearance: none;
      width: 25px;
      height: 25px;
      border-radius: 8px;
      border: 2px solid var(--check-border);
      background: var(--check-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
      flex-shrink: 0;
      outline: none;
    }

    .idea-check:checked {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: var(--check-checked-border);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .idea-check:checked::after {
      content: "✓";
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 6px rgba(255,255,255,0.8);
    }

    .idea-text {
      flex: 1;
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-word;
      transition: all 0.3s ease;
      line-height: 1.6;
    }

    .idea-item.completed .idea-text {
      color: var(--text-completed);
      opacity: 0.55;
    }

    .idea-item.completed {
      background: var(--item-completed-bg);
      border-color: var(--panel-border);
    }

    .idea-text mark {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1e293b;
      padding: 0.05rem 0.25rem;
      border-radius: 4px;
      font-weight: 700;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      opacity: 0.6;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .delete-btn:active {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* ================= ADD SECTION ================= */
    .add-section {
      display: flex;
      gap: 0.7rem;
      align-items: stretch;
    }

    .add-section input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 1.4rem;
      padding: 1rem 1.3rem;
      font-size: 0.98rem;
      color: var(--text-primary);
      outline: none;
      transition: all 0.25s;
      min-width: 0;
    }

    .add-section input::placeholder { color: var(--text-muted); }

    .add-section input:focus {
      border-color: var(--accent);
      background: var(--input-focus-bg);
      box-shadow: 0 0 22px var(--accent-glow);
    }

    .add-section button {
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      border: 1px solid var(--accent);
      border-radius: 1.4rem;
      padding: 1rem 1.6rem;
      font-size: 0.98rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      box-shadow: 0 8px 20px -8px var(--accent-glow);
      transition: all 0.2s;
    }

    .add-section button:active { transform: scale(0.97); }

    .toast {
      position: fixed;
      bottom: calc(2rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      color: var(--text-primary);
      padding: 0.85rem 1.5rem;
      border-radius: 1rem;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      font-size: 0.92rem;
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.3, 1, 0.4, 1);
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .panel { padding: 1.4rem 1.1rem; border-radius: 1.8rem; margin-top: 0.5rem; }
      .header h1 { font-size: 1.35rem; }
      .toolbar { flex-direction: column; }
      .sort-wrap, .sort-btn { width: 100%; justify-content: space-between; }
      .add-section { flex-direction: column; }
      .add-section button { justify-content: center; padding: 0.9rem; }
      .idea-list { max-height: 42vh; }
    }

    .idea-item.new-item { animation: pulse 0.6s ease; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--accent-glow); }
      70% { box-shadow: 0 0 18px 3px var(--accent-glow); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1><span class="icon">💡</span> IdeaVault</h1>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="تغییر تم">🌙</button>
      </div>
    </div>

    <div class="stats-card">
      <div class="stats-top">
        <span class="stats-label">پیشرفت کلی</span>
        <span class="stats-percent"><span class="num" id="percentNum">۰٪</span></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stats-detail">
        <span>✅ انجام‌شده: <strong id="doneStat">۰</strong></span>
        <span>⏳ باقی‌مانده: <strong id="remainStat">۰</strong></span>
        <span>📝 کل: <strong id="totalStat">۰</strong></span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="جستجو در ایده‌ها..." autocomplete="off">
        <button class="clear-search" id="clearSearch">✕</button>
      </div>
      <div class="sort-wrap" id="sortWrap">
        <button class="sort-btn" id="sortBtn">
          <span id="sortLabel">جدیدترین</span>
          <span class="arrow">▼</span>
        </button>
        <div class="sort-menu" id="sortMenu">
          <div class="sort-option" data-sort="newest"><span>جدیدترین</span><span class="check">✓</span></div>
          <div class="sort-option" data-sort="oldest"><span>قدیمی‌ترین</span><span class="check">✓</span></div>
          <div class="sort-option" data-sort="incomplete"><span>انجام‌نشده‌ها اول</span><span class="check">✓</span></div>
          <div class="sort-option" data-sort="completed"><span>انجام‌شده‌ها اول</span><span class="check">✓</span></div>
          <div class="sort-option" data-sort="alpha"><span>الفبایی</span><span class="check">✓</span></div>
        </div>
      </div>
    </div>

    <div class="idea-list" id="ideaList"></div>

    <div class="add-section">
      <input type="text" id="ideaInput" placeholder="ایده جدیدت رو بنویس..." maxlength="200" autocomplete="off">
      <button id="addBtn">+ افزودن</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'ideavault_ideas_v1';
      const THEME_KEY = 'ideavault_theme';
      const SORT_KEY = 'ideavault_sort';

      const ideaListEl = document.getElementById('ideaList');
      const ideaInput = document.getElementById('ideaInput');
      const addBtn = document.getElementById('addBtn');
      const searchInput = document.getElementById('searchInput');
      const clearSearch = document.getElementById('clearSearch');
      const themeToggle = document.getElementById('themeToggle');
      const sortWrap = document.getElementById('sortWrap');
      const sortBtn = document.getElementById('sortBtn');
      const sortLabel = document.getElementById('sortLabel');
      const progressFill = document.getElementById('progressFill');
      const percentNum = document.getElementById('percentNum');
      const doneStat = document.getElementById('doneStat');
      const remainStat = document.getElementById('remainStat');
      const totalStat = document.getElementById('totalStat');
      const toastEl = document.getElementById('toast');

      let currentSort = localStorage.getItem(SORT_KEY) || 'newest';
      let searchQuery = '';

      const sortLabels = {
        newest: 'جدیدترین',
        oldest: 'قدیمی‌ترین',
        incomplete: 'انجام‌نشده‌ها اول',
        completed: 'انجام‌شده‌ها اول',
        alpha: 'الفبایی'
      };

      function toFa(num) {
        const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
        return String(num).replace(/\d/g, d => fa[d]);
      }

      let toastTimer;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
        localStorage.setItem(THEME_KEY, theme);
      }

      function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved) { applyTheme(saved); return; }
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        applyTheme(prefersLight ? 'light' : 'dark');
      }

      themeToggle.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        applyTheme(cur === 'light' ? 'dark' : 'light');
      });

      function loadIdeas() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      }

      function saveIdeas(ideas) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas));
      }

      function updateStats(ideas) {
        const total = ideas.length;
        const done = ideas.filter(i => i.completed).length;
        const remain = total - done;
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);

        progressFill.style.width = percent + '%';
        percentNum.textContent = toFa(percent) + '٪';
        doneStat.textContent = toFa(done);
        remainStat.textContent = toFa(remain);
        totalStat.textContent = toFa(total);
      }

      function filterAndSort(ideas) {
        let list = [...ideas];

        if (searchQuery.trim()) {
          const q = searchQuery.trim().toLowerCase();
          list = list.filter(i => i.text.toLowerCase().includes(q));
        }

        switch (currentSort) {
          case 'newest':
            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            break;
          case 'oldest':
            list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            break;
          case 'incomplete':
            list.sort((a, b) => {
              if (a.completed !== b.completed) return a.completed ? 1 : -1;
              return (b.createdAt || 0) - (a.createdAt || 0);
            });
            break;
          case 'completed':
            list.sort((a, b) => {
              if (a.completed !== b.completed) return a.completed ? -1 : 1;
              return (b.createdAt || 0) - (a.createdAt || 0);
            });
            break;
          case 'alpha':
            list.sort((a, b) => a.text.localeCompare(b.text, 'fa'));
            break;
        }
        return list;
      }

      function highlightText(text, query) {
        if (!query.trim()) return document.createTextNode(text);
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${escaped})`, 'gi');
        const parts = text.split(regex);
        const frag = document.createDocumentFragment();
        parts.forEach(part => {
          if (part.toLowerCase() === query.toLowerCase()) {
            const mark = document.createElement('mark');
            mark.textContent = part;
            frag.appendChild(mark);
          } else if (part) {
            frag.appendChild(document.createTextNode(part));
          }
        });
        return frag;
      }

      function render() {
        const all = loadIdeas();
        const visible = filterAndSort(all);

        ideaListEl.innerHTML = '';

        if (all.length === 0) {
          ideaListEl.innerHTML = `
            <div class="empty-state">
              <span class="emoji">✨</span>
              هنوز ایده‌ای ثبت نشده<br>
              اولین ایده‌ات رو بنویس و اضافه کن
            </div>`;
        } else if (visible.length === 0) {
          ideaListEl.innerHTML = `
            <div class="empty-state">
              <span class="emoji">🔍</span>
              ایده‌ای با این جستجو پیدا نشد
            </div>`;
        } else {
          visible.forEach((idea, index) => {
            const item = document.createElement('div');
            item.className = `idea-item ${idea.completed ? 'completed' : ''}`;
            item.dataset.id = idea.id;
            item.style.animationDelay = `${Math.min(index * 0.025, 0.25)}s`;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'idea-check';
            checkbox.checked = !!idea.completed;

            checkbox.addEventListener('change', (e) => {
              const allList = loadIdeas();
              const target = allList.find(i => i.id === idea.id);
              if (target) {
                target.completed = e.target.checked;
                saveIdeas(allList);
              }
              item.classList.toggle('completed', e.target.checked);
              updateStats(allList);
              showToast(e.target.checked ? '✅ انجام شد!' : '↩️ برگشت به انجام‌نشده');
            });

            const textSpan = document.createElement('span');
            textSpan.className = 'idea-text';
            textSpan.appendChild(highlightText(idea.text, searchQuery));

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '✕';
            deleteBtn.addEventListener('click', () => {
              const updated = loadIdeas().filter(i => i.id !== idea.id);
              saveIdeas(updated);
              item.style.opacity = '0';
              item.style.transform = 'translateX(20px)';
              setTimeout(() => render(), 200);
              showToast('🗑️ ایده حذف شد');
            });

            item.appendChild(checkbox);
            item.appendChild(textSpan);
            item.appendChild(deleteBtn);
            ideaListEl.appendChild(item);
          });
        }

        updateStats(all);
      }

      function addNewIdea() {
        const text = ideaInput.value.trim();
        if (!text) {
          ideaInput.focus();
          return;
        }

        const ideas = loadIdeas();
        const newIdea = {
          id: 'idea_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
          text: text,
          completed: false,
          createdAt: Date.now()
        };

        ideas.push(newIdea);
        saveIdeas(ideas);
        render();

        ideaInput.value = '';
        ideaInput.focus();

        const newItem = ideaListEl.querySelector(`[data-id="${newIdea.id}"]`);
        if (newItem) {
          newItem.classList.add('new-item');
          setTimeout(() => newItem.classList.remove('new-item'), 700);
        }
        showToast('💡 ایده اضافه شد');
      }

      addBtn.addEventListener('click', addNewIdea);

      ideaInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addNewIdea();
        }
      });

      let searchTimer;
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        clearSearch.classList.toggle('visible', searchQuery.length > 0);
        clearTimeout(searchTimer);
        searchTimer = setTimeout(render, 120);
      });

      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearch.classList.remove('visible');
        render();
        searchInput.focus();
      });

      function setSort(key) {
        currentSort = key;
        localStorage.setItem(SORT_KEY, key);
        sortLabel.textContent = sortLabels[key];
        document.querySelectorAll('.sort-option').forEach(opt => {
          opt.classList.toggle('active', opt.dataset.sort === key);
        });
        sortWrap.classList.remove('open');
        render();
      }

      sortBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sortWrap.classList.toggle('open');
      });

      document.querySelectorAll('.sort-option').forEach(opt => {
        opt.addEventListener('click', () => setSort(opt.dataset.sort));
      });

      document.addEventListener('click', (e) => {
        if (!sortWrap.contains(e.target)) sortWrap.classList.remove('open');
      });

      initTheme();
      setSort(currentSort);
    })();
  </script>
</body>
